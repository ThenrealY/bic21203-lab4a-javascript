<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 4a Question 2 - Smart Number Validator</title>
  <link rel="stylesheet" href="../assets/styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">Lab 4a · Question 2</p>
    <h1>Smart Number Validator</h1>
    <p class="intro">Enter a number to compare it with 10. Empty text and non-numeric values are rejected.</p>

    <section class="demo" aria-label="Number validation form">
      <label for="userInput">Enter a number:</label>
      <input type="text" id="userInput" inputmode="decimal" placeholder="Enter a number">
      <button id="checkBtn" type="button">Check Number</button>
      <p id="result" role="status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
